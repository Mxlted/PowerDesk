<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- PowerDesk app icon: gradient squircle, 2x2 module tiles, power glyph in the top-right tile. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EA2FF"/>
      <stop offset="1" stop-color="#5B3DF5"/>
    </linearGradient>
    <radialGradient id="hl" cx="204.8" cy="51.2" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="squircle">
      <rect width="1024" height="1024" rx="230.4" ry="230.4"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#hl)"/>
  </g>

  <g fill="#FFFFFF">
    <rect x="209.92" y="209.92" width="271.36" height="271.36" rx="66.56" ry="66.56"/>
    <rect x="209.92" y="542.72" width="271.36" height="271.36" rx="66.56" ry="66.56"/>
    <rect x="542.72" y="542.72" width="271.36" height="271.36" rx="66.56" ry="66.56"/>
  </g>

  <g fill="none" stroke="#FFFFFF" stroke-width="46.13" stroke-linecap="round">
    <path d="M 733.05 258.15 A 103.12 103.12 0 1 1 623.75 258.15"/>
    <path d="M 678.4 242.48 V 327.69"/>
  </g>
</svg>
